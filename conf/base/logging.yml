version: 1
disable_existing_loggers: false

formatters:
  file:
    format: "%(asctime)s %(levelname)s %(name)s: %(message)s"

handlers:
  console:
    class: kedro.logging.RichHandler
    level: INFO
    rich_tracebacks: true
  debug_file:
    class: logging.handlers.RotatingFileHandler
    level: DEBUG
    formatter: file
    filename: logs/debug.log
    maxBytes: 10485760
    backupCount: 5
    encoding: utf8
  info_file:
    class: logging.handlers.RotatingFileHandler
    level: INFO
    formatter: file
    filename: logs/info.log
    maxBytes: 10485760
    backupCount: 5
    encoding: utf8
  warning_file:
    class: logging.handlers.RotatingFileHandler
    level: WARNING
    formatter: file
    filename: logs/warning.log
    maxBytes: 10485760
    backupCount: 5
    encoding: utf8
  error_file:
    class: logging.handlers.RotatingFileHandler
    level: ERROR
    formatter: file
    filename: logs/error.log
    maxBytes: 10485760
    backupCount: 5
    encoding: utf8

loggers:
  hotel_no_show_prediction:
    level: DEBUG
  kedro:
    level: INFO

root:
  level: DEBUG
  handlers: [console, debug_file, info_file, warning_file, error_file]
